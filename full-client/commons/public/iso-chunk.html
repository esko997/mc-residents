<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Chunk diorama prototype — Minecraft residents</title>
<link rel="stylesheet" href="app.css">
<style>
  body { display: block; }
  .proto { max-width: 1180px; margin: 0 auto; padding: 14px; }
  .proto h1 { font-size: 1.25rem; margin-bottom: 6px; }
  .proto label { display: inline-flex; gap: 6px; align-items: center; font-size: .875rem; color: var(--lichen); }
  .proto select, .proto input[type=range] { accent-color: var(--glow); }
  .proto select { background: #15181c; border: 2px solid var(--seam); padding: 4px 6px; }
  #iso-box { height: min(72dvh, 720px); border: 2px solid var(--seam); background: #14171b; margin: 10px 0; }
  #iso { display: block; width: 100%; height: 100%; }
  #iso-cut-resident { background: none; border: 2px solid var(--seam); border-radius: 2px; padding: 6px 10px; font-size: .875rem; font-weight: 700; color: var(--lichen); cursor: pointer; }
</style>
</head>
<body>
<main class="proto">
  <h1>Chunk diorama prototype</h1>
  <p class="fine">Not linked from the dashboard. Synthetic terrain only (seeded noise, one carved tunnel and a resident standing in it); no world data is read. See <code>docs/map-3d.md</code>.</p>
  <div class="controls" style="margin-top:10px">
    <label>Scene <select data-set="scene"><option value="overworld">Overworld</option><option value="nether">Nether</option></select></label>
    <label>Chunks <select data-set="chunks" data-number="1"><option value="1">1</option><option value="9">9 (3×3)</option><option value="25">25 (5×5)</option><option value="81">81 (9×9)</option></select></label>
    <label>Cut-away <input type="range" min="10" max="127" value="127" data-set="cut"> <span id="iso-cut-value" class="data"></span></label>
    <button type="button" id="iso-cut-resident">Cut just above the resident</button>
    <label><input type="checkbox" data-set="surfaceOnly"> Heightmap only (top block per column)</label>
    <label><input type="checkbox" data-set="ghost" checked> Show the resident through rock</label>
  </div>
  <div id="iso-box"><canvas id="iso" aria-label="Isometric view of synthetic chunks"></canvas></div>
  <p id="iso-stats" class="readout" aria-live="polite"></p>
</main>
<script type="module" src="iso-chunk.js"></script>
</body>
</html>
