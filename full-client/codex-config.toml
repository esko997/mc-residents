# Gary's own Codex home: only his persona (in his directory) and his body's tools.
cli_auth_credentials_store = "file"
model = "gpt-6.2-sol"
model_reasoning_effort = "medium"
# The model's default for gpt-6.2-sol is "none": reasoning items then carry only
# encrypted content and an empty summary. "concise" asks for short readable
# summaries, which the Commons dashboard shows as each resident's thoughts. It
# does not change the model, the effort or what the resident is told.
model_reasoning_summary = "concise"
# Older history is summarised once a request passes this size. At 60K the
# residents lost everything older than about nine minutes (20 summaries in a
# 3.4-hour run) and with it any momentum on long jobs; 150K keeps roughly
# half an hour, at about two and a half times the (mostly cached) input.
model_auto_compact_token_limit = 150000

[projects."/home/swatson/gary-client/resident"]
trust_level = "trusted"

[mcp_servers.body]
command = "/home/swatson/gary-client/bin/bun"
args = ["/home/swatson/gary-client/toolserver/src/main.ts"]
startup_timeout_sec = 30
# `wait` can hold for two minutes; a skill may run for up to ten.
tool_timeout_sec = 660
default_tools_approval_mode = "approve"

[mcp_servers.body.env]
CLIENT_LOG = "/home/swatson/gary-client/game/logs/latest.log"
RESIDENT_NAME = "Gary"
RESIDENT_DIR = "/home/swatson/gary-client/resident/gary"
KNOWLEDGE_DB = "/home/swatson/gary-client/knowledge.sqlite"
# Shared Knowledge goes through the hub; run-session.sh overrides these per resident.
COMMONS_URL = "http://127.0.0.1:8770/"
COMMONS_TOKEN_FILE = "/home/swatson/gary-client/commons-tokens/Gary"
