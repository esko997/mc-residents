[Unit]
Wants=resident-video.service
After=resident-video.service

[Service]
Environment=COMMONS_LIVE_ENABLED=true
# Explicit selection only; failure never changes encoders automatically.
# Inspiron (hub, NVIDIA): the default h264_nvenc, or say so explicitly:
# Environment=COMMONS_LIVE_ENCODER=h264_nvenc
# Chungus1 (station, AMD RX 590): VAAPI on its render node (confirm the node there):
# Environment=COMMONS_LIVE_ENCODER=h264_vaapi
# Environment=COMMONS_LIVE_VAAPI_DEVICE=/dev/dri/renderD128
# Environment=COMMONS_LIVE_ENCODER=libx264
# Audio is off by default. Enable only with a dedicated GARY_CLIENT_AUDIO_SINK
# configured for each selected resident and created by its launcher.
# Environment=COMMONS_LIVE_AUDIO=true
