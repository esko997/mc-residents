# Private resident video transport. Only Commons may negotiate viewers or publish.
# The sole LAN listener is encrypted WebRTC media; signaling stays behind Commons.
logLevel: warn
logDestinations: [stdout]
readTimeout: 5s
writeTimeout: 5s
writeQueueSize: 128

authMethod: internal
authInternalUsers:
  - user: any
    ips: [127.0.0.1, "::1"]
    permissions:
      - action: publish
        path: resident
      - action: read
        path: resident

api: false
metrics: false
pprof: false
playback: false
rtsp: true
rtspAddress: 127.0.0.1:8554
rtspTransports: [tcp]
rtmp: false
hls: false
srt: false
moq: false
webrtc: true
webrtcAddress: 127.0.0.1:8889
webrtcAllowOrigins: []
webrtcLocalUDPAddress: :8189
webrtcLocalTCPAddress: :8189
webrtcIPsFromInterfaces: true
webrtcICEServers2: []
webrtcHandshakeTimeout: 10s
webrtcTrackGatherTimeout: 3s

paths:
  resident:
    source: publisher
    overridePublisher: false
    maxReaders: 4
    record: false
